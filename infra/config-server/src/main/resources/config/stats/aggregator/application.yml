server:
  port: 0

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: aggregator-service

topic:
  user-actions: stats.user-actions.v1
  event-similarity: stats.events-similarity.v1

management:
  server:
    port: 9095
  endpoints:
    web:
      exposure:
        include: health,info,env

logging:
  level:
    ru.practicum: DEBUG